name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    uses: ./.github/workflows/repository-baseline.yml
  secrets:
    uses: ./.github/workflows/secret-scan.yml
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and run verified actionlint release
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tool_dir="$(mktemp -d "${RUNNER_TEMP}/actionlint.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "${tool_dir}/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "${tool_dir}/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "${tool_dir}/actionlint.tar.gz" -C "$tool_dir" actionlint
          "${tool_dir}/actionlint" -color
  node-container:
    name: Node ${{ matrix.node }} in browser container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        node: ["22.23.3", "24.21.0", "24.22.1"]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://npm.pkg.github.com
          scope: "@dkvirtual"
      - name: Verify exact runtime and isolated configuration
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: |
          test "$(node --version)" = "v$EXPECTED_NODE"
          case "$(command -v node)" in "$RUNNER_TEMP"/node-runtime.*/bin/node) ;; *) exit 1 ;; esac
          test "$(npm config get @dkvirtual:registry)" = https://npm.pkg.github.com
          test "$(stat -c '%a' "$NPM_CONFIG_USERCONFIG")" = 600
