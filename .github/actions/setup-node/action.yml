name: Job-local Node
description: Install a checksum-pinned Node runtime without changing the runner-wide tool cache.
inputs:
  node-version:
    description: Reviewed exact Node version.
    required: false
  node-version-file:
    description: File containing a reviewed exact Node version.
    required: false
  registry-url:
    description: Optional npm registry requiring NODE_AUTH_TOKEN in installation/publishing steps.
    required: false
  scope:
    description: Optional package scope for the registry.
    required: false
runs:
  using: composite
  steps:
    - name: Install verified Node in job scratch space
      shell: bash
      env:
        REQUESTED_NODE_VERSION: ${{ inputs.node-version }}
        NODE_VERSION_FILE: ${{ inputs.node-version-file }}
        NPM_REGISTRY: ${{ inputs.registry-url }}
        NPM_SCOPE: ${{ inputs.scope }}
      run: |
        set -euo pipefail
        test "$(uname -s)" = Linux
        test "$(uname -m)" = x86_64
        version="$REQUESTED_NODE_VERSION"
        if [ -z "$version" ]; then version="$(tr -d '[:space:]' < "$NODE_VERSION_FILE")"; fi
        version="${version#v}"
        case "$version" in
          22.23.3) checksum=df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de ;;
          24.21.0) checksum=fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6 ;;
          *) echo "Unsupported Node version; review and pin its official checksum first." >&2; exit 1 ;;
        esac
        tool_dir="$(mktemp -d "$RUNNER_TEMP/node-runtime.XXXXXX")"
        curl --fail --silent --show-error --location --retry 3 "https://nodejs.org/dist/v$version/node-v$version-linux-x64.tar.xz" -o "$tool_dir/node.tar.xz"
        printf '%s  %s\n' "$checksum" "$tool_dir/node.tar.xz" | sha256sum --check --strict
        tar -xJf "$tool_dir/node.tar.xz" --strip-components=1 -C "$tool_dir"
        rm "$tool_dir/node.tar.xz"
        echo "$tool_dir/bin" >> "$GITHUB_PATH"
        "$tool_dir/bin/node" --version
        if [ -n "$NPM_REGISTRY" ]; then
          test "$NPM_REGISTRY" = https://npm.pkg.github.com
          test "$NPM_SCOPE" = '@dkvirtual'
          umask 077
          npm_config="$(mktemp "$RUNNER_TEMP/npm-auth.XXXXXX")"
          printf '%s\n' '@dkvirtual:registry=https://npm.pkg.github.com' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$npm_config"
          echo "NPM_CONFIG_USERCONFIG=$npm_config" >> "$GITHUB_ENV"
        fi
