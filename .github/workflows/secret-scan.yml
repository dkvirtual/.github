name: Secret scan

on:
  workflow_call:
    inputs:
      runner-labels:
        description: JSON array of runner labels; use self-hosted runners only for trusted code.
        required: false
        type: string
        default: '["ubuntu-24.04"]'

permissions:
  contents: read

jobs:
  secret-scan:
    if: inputs.runner-labels == '["ubuntu-24.04"]' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Secret scanning
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 10
    steps:
      - name: Check out the caller repository and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tool_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${tool_dir}/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "${tool_dir}/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "${tool_dir}/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan the fetched Git history
        shell: bash
        run: gitleaks git --redact --no-banner --log-opts=--all .
