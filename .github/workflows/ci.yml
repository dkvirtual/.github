name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    uses: ./.github/workflows/repository-baseline.yml
  secrets:
    uses: ./.github/workflows/secret-scan.yml
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and run verified actionlint release
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tool_dir="$(mktemp -d "${RUNNER_TEMP}/actionlint.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "${tool_dir}/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "${tool_dir}/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "${tool_dir}/actionlint.tar.gz" -C "$tool_dir" actionlint
          "${tool_dir}/actionlint" -color
